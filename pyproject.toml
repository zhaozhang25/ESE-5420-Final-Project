[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppers"
version = "0.1.0"
description = "Does an MLP beat logistic regression at predicting online purchases?"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "matplotlib", "pyyaml"]

[tool.setuptools.packages.find]
include = ["shoppers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
